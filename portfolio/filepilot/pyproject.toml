[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filepilot"
version = "1.0.0"
description = "Practical file organization, analysis and incremental backup CLI"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
filepilot = "filepilot.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
