[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-api-toolkit"
version = "1.0.0"
description = "CLI for integrating Python applications with generative AI APIs"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
ai-toolkit = "ai_toolkit.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
